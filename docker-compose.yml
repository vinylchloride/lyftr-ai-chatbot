services:
  backend:
    build:
      context: ./backend
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.5-flash-lite}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-25}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-20}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-512}
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are a helpful, concise assistant. Use the conversation history when answering.}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
    volumes:
      - chatbot_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chatbot_data:
